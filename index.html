<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <title>Maze | Unity WebGL in Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ... ваш CSS без изменений ... */
    </style>
</head>
<body>
    <!-- ... ваш HTML без изменений ... -->

    <script>
        const canvas = document.getElementById('unity-canvas');
        const loadingBar = document.getElementById('unity-loading-bar');
        const progressBarFull = document.getElementById('unity-progress-bar-full');
        const progressPercent = document.getElementById('progress-percent');
        const warningBanner = document.getElementById('unity-warning');

        function unityShowBanner(msg, type) {
            // ... ваша функция без изменений ...
        }

        // ===== ВАЖНО: ВЫБЕРИТЕ ПРАВИЛЬНЫЙ ПУТЬ =====
        // Вариант 1: Если Build в той же папке, что и index.html
        const buildUrl = "Build";

        // Вариант 2: Если Build в папке maze
        // const buildUrl = "maze/Build";

        // Вариант 3: Автоматическое определение (если не уверены)
        // const buildUrl = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + 'Build';

        console.log('Путь к Build:', buildUrl); // Проверьте в консоли

        const loaderUrl = buildUrl + "/Telegram.loader.js";

        // ===== ЭТО ГЛАВНОЕ ИЗМЕНЕНИЕ =====
        // ВАЖНО: Добавляем путь к StreamingAssets через buildUrl
        const streamingAssetsPath = buildUrl + "/StreamingAssets";

        const config = {
            dataUrl: buildUrl + "/telegram.data",
            frameworkUrl: buildUrl + "/telegram.framework.js",
            codeUrl: buildUrl + "/telegram.wasm",
            streamingAssetsUrl: streamingAssetsPath,  // ← Вот сюда добавили!
            companyName: "DefaultCompany",
            productName: "Maze",
            productVersion: "1.0",
            showBanner: unityShowBanner
        };

        console.log('Путь к StreamingAssets:', streamingAssetsPath); // Проверьте в консоли

        loadingBar.style.display = "block";

        const script = document.createElement('script');
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                const percent = Math.round(progress * 100);
                progressBarFull.style.width = percent + "%";
                progressPercent.textContent = percent + "%";
            }).then((instance) => {
                loadingBar.style.display = "none";
                window.unityInstance = instance;

                if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe) {
                    const u = Telegram.WebApp.initDataUnsafe.user;
                    if (u) {
                        instance.SendMessage("WebAppBridge", "OnTelegramUserData", JSON.stringify({
                            id: u.id, first_name: u.first_name, username: u.username
                        }));
                    }
                }
            }).catch(err => {
                console.error("createUnityInstance failed:", err);
                unityShowBanner("Ошибка загрузки Unity: " + err, "error");
            });
        };
        script.onerror = () => unityShowBanner("Не удалось загрузить " + loaderUrl, "error");
        document.body.appendChild(script);
    </script>
</body>
</html>
