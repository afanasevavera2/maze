<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes" />
    <title>Maze | Unity WebGL in Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px 30px;
            border-radius: 20px;
            border: 2px solid transparent;
            animation: borderGlow 2s infinite alternate;
            z-index: 1000;
        }

        @keyframes borderGlow {
            0% {
                border-color: #ff0080;
                box-shadow: 0 0 20px rgba(255, 0, 128, 0.3);
            }

            100% {
                border-color: #8000ff;
                box-shadow: 0 0 30px rgba(128, 0, 255, 0.5);
            }
        }

        #unity-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #ff0080, #8000ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            animation: logoSpin 3s infinite linear;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
        }

        @keyframes logoSpin {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.1);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        #loading-text {
            font-size: 18px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff0080, #8000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textPulse 1.5s infinite alternate;
        }

        @keyframes textPulse {
            0% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        #unity-progress-bar-empty {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff0080, #8000ff);
            border-radius: 10px;
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }

            #unity-progress-bar-full::after {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
                animation: progressShine 1.5s infinite;
            }

        @keyframes progressShine {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        #progress-percent {
            margin-top: 10px;
            font-size: 14px;
            color: #ccc;
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translateX(-50%);
            background: #cc0000;
            padding: 10px;
            border-radius: 5px;
            color: white;
            display: none;
            z-index: 2000;
        }

        #error-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            color: #ff0;
            font-family: monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-radius: 5px;
            z-index: 3000;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo">M</div>
            <div id="loading-text">Загрузка игры</div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div id="progress-percent">0%</div>
        </div>
        <div id="unity-warning"></div>
        <div id="error-info">Загрузка...</div>
    </div>

    <script>
        function log(message) {
            console.log(message);
            const errorDiv = document.getElementById('error-info');
            const time = new Date().toLocaleTimeString();
            errorDiv.innerHTML = time + ': ' + message + '<br>' + errorDiv.innerHTML;
        }

        log('Скрипт запущен');

        // ВАЖНО: Укажите правильный путь к папке Build!
        // Попробуйте по очереди эти варианты:

        // Вариант 1: Если Build в той же папке, что и index.html
        const buildUrl = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + 'Build';

        // Вариант 2: Если Build в папке maze
        // const buildUrl = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + 'maze/Build';

        // Вариант 3: Если index.html в корне, а Build в подпапке
        // const buildUrl = '/Build';

        // Вариант 4: Простой относительный путь
        // const buildUrl = 'Build';

        log('Попытка загрузить из: ' + buildUrl);

        const canvas = document.getElementById('unity-canvas');
        const loadingBar = document.getElementById('unity-loading-bar');
        const progressBarFull = document.getElementById('unity-progress-bar-full');
        const progressPercent = document.getElementById('progress-percent');
        const warningBanner = document.getElementById('unity-warning');

        function unityShowBanner(msg, type) {
            log(type + ': ' + msg);
            const div = document.createElement('div');
            div.innerHTML = msg;
            div.style.cssText = type === 'error' ? 'background:red;padding:8px;color:#fff' : 'background:yellow;padding:8px;color:#000';
            warningBanner.appendChild(div);
            warningBanner.style.display = 'block';
            setTimeout(() => {
                try {
                    warningBanner.removeChild(div);
                    if (warningBanner.children.length === 0) {
                        warningBanner.style.display = 'none';
                    }
                } catch (e) { }
            }, 5000);
        }

        // Проверяем существование файлов перед загрузкой
        function checkFileExists(url) {
            return fetch(url, { method: 'HEAD' })
                .then(response => response.ok)
                .catch(() => false);
        }

        async function initGame() {
            const loaderUrl = buildUrl + '/Telegram.loader.js';

            log('Проверяем наличие: ' + loaderUrl);

            const exists = await checkFileExists(loaderUrl);

            if (!exists) {
                log('❌ ФАЙЛ НЕ НАЙДЕН!');
                log('Текущий URL страницы: ' + window.location.href);
                log('Попробуйте другие варианты buildUrl в коде');
                log('');
                log('Проверьте, что файлы существуют по адресу:');
                log(loaderUrl);
                return;
            }

            log('✅ Файл найден! Загружаем...');

            const config = {
                dataUrl: buildUrl + '/telegram.data',
                frameworkUrl: buildUrl + '/telegram.framework.js',
                codeUrl: buildUrl + '/telegram.wasm',
                streamingAssetsUrl: buildUrl + '/StreamingAssets',
                companyName: "DefaultCompany",
                productName: "Maze",
                productVersion: "1.0",
                showBanner: unityShowBanner
            };

            loadingBar.style.display = "block";

            const script = document.createElement('script');
            script.src = loaderUrl;

            script.onload = () => {
                log('✅ Загрузчик загружен');

                if (typeof createUnityInstance === 'undefined') {
                    log('❌ Ошибка: createUnityInstance не определена!');
                    return;
                }

                log('Запуск Unity...');

                createUnityInstance(canvas, config, (progress) => {
                    const percent = Math.round(progress * 100);
                    progressBarFull.style.width = percent + "%";
                    progressPercent.textContent = percent + "%";
                }).then((instance) => {
                    log('✅ Игра успешно загружена!');
                    loadingBar.style.display = "none";
                    window.unityInstance = instance;

                    if (window.Telegram?.WebApp) {
                        Telegram.WebApp.ready();
                        Telegram.WebApp.expand();

                        if (Telegram.WebApp.initDataUnsafe?.user) {
                            const u = Telegram.WebApp.initDataUnsafe.user;
                            try {
                                instance.SendMessage("WebAppBridge", "OnTelegramUserData", JSON.stringify({
                                    id: u.id,
                                    first_name: u.first_name,
                                    username: u.username
                                }));
                            } catch (e) {
                                log('Ошибка отправки данных: ' + e);
                            }
                        }
                    }
                }).catch(err => {
                    log('❌ Ошибка загрузки Unity: ' + err);
                    unityShowBanner("Ошибка загрузки Unity: " + err, "error");
                });
            };

            script.onerror = () => {
                log('❌ Ошибка загрузки скрипта');
            };

            document.body.appendChild(script);
        }

        window.onload = initGame;
    </script>
</body>
</html>
